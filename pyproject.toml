[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harborlens"
version = "0.2.0.dev0"
description = "Auditable AIS stationary candidates for U.S. ports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
noaa = ["zstandard>=0.22"]
dev = ["pytest>=8", "jsonschema>=4", "cryptography>=42"]
release = ["cryptography>=42"]
geo = ["shapely>=2.0,<3"]

[project.scripts]
harborlens = "harborlens.cli:main"
harborlens-download-noaa = "harborlens.download:main"
harborlens-verify = "harborlens.provenance:main"
harborlens-fetch-erddap = "harborlens.erddap:main"
harborlens-extract-noaa-archive = "harborlens.archive_extract:main"
harborlens-multiday = "harborlens.multiday:main"
harborlens-fetch-usace = "harborlens.usace:main"
harborlens-fetch-noaa-anchorages = "harborlens.noaa_anchorages:main"
harborlens-zone-context = "harborlens.zone_context:main"
harborlens-track-context = "harborlens.track_context:main"
harborlens-geometry-vintage = "harborlens.vintage:main"
harborlens-sensitivity = "harborlens.sensitivity:main"
harborlens-label-sample = "harborlens.labeling:sample_main"
harborlens-label-agreement = "harborlens.labeling:agreement_main"
harborlens-evaluate = "harborlens.evaluation:main"
harborlens-release-summary = "harborlens.publication:main"
harborlens-verify-release = "harborlens.release_verify:main"
harborlens-cfr-anchorage-audit = "harborlens.cfr_anchorages:main"
harborlens-fr-timeline = "harborlens.fr_timeline:main"
harborlens-fr-fulltext = "harborlens.fr_fulltext:main"

[tool.setuptools.packages.find]
where = ["src"]
