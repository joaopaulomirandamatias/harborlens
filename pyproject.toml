[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harborlens"
version = "0.1.0"
description = "Auditable AIS stationary candidates for U.S. ports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
noaa = ["zstandard>=0.22"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
harborlens = "harborlens.cli:main"
harborlens-download-noaa = "harborlens.download:main"
harborlens-verify = "harborlens.provenance:main"
harborlens-fetch-erddap = "harborlens.erddap:main"
harborlens-extract-noaa-archive = "harborlens.archive_extract:main"

[tool.setuptools.packages.find]
where = ["src"]
