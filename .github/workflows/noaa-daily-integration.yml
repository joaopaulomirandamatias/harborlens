name: NOAA nationwide daily archive integration (research only)
on:
  push:
    branches: [integration/noaa-daily]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-archive-houston:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NOAA optional dependency
        run: python -m pip install -e '.[noaa]'
      - name: Download a capped historical NOAA national daily source
        run: |
          harborlens-download-noaa --date 2024-01-02 --directory data --max-mib 300
      - name: Fully scan source and extract six Houston hours with strict limits
        run: |
          harborlens-extract-noaa-archive \
            --input data/ais-2024-01-02.csv.zst \
            --out data/houston-2024-01-02.csv \
            --start 2024-01-02T00:00:00Z \
            --end 2024-01-02T06:00:00Z \
            --bbox -95.7 29.1 -94.2 30.1 \
            --max-rows 250000 --max-output-mib 64 \
            --max-uncompressed-gib 8
      - name: Process historical records and check local hashes
        run: |
          harborlens --input data/houston-2024-01-02.csv --out results/noaa-daily
          harborlens-verify --manifest results/noaa-daily/manifest.json
      - name: Publish aggregate QA only (no MMSIs or raw AIS)
        run: |
          python - <<'PY'
          import csv, json, os
          from collections import Counter
          from pathlib import Path
          source=json.loads(Path("data/houston-2024-01-02.csv.source.json").read_text())
          result=json.loads(Path("results/noaa-daily/manifest.json").read_text())
          with Path("data/houston-2024-01-02.csv").open(newline="") as f:
              frequencies=Counter(x["MMSI"] for x in csv.DictReader(f))
          output={
              "source_archive_sha256":source["input_sha256"],
              "subset_sha256":source["output_sha256"],
              "source_rows_scanned":source["counts"]["rows_scanned"],
              "subset_records":source["counts"]["selected"],
              "distinct_mmsi":len(frequencies),
              "mmsi_with_two_or_more_observations":sum(n>=2 for n in frequencies.values()),
              "max_observations_per_mmsi":max(frequencies.values(), default=0),
              "candidate_count_unvalidated":result["events"]["stationary_candidates"],
              "run_sha256":result["run_id"],
              "rights_status":source["rights_status"]
          }
          print(json.dumps(output,indent=2))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("### Original NOAA daily AIS → Houston subset (research)\n\n")
              out.write("Source is downloaded ephemerally; raw AIS is NOT uploaded. No port-call accuracy claim.\n\n")
              out.write("\n".join("- **%s:** %s" %(k,v) for k,v in output.items()))
          PY
