name: Official December 2023 LSA Title 33 extraction (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text reader
        run: python -m pip install 'pypdf>=5,<7'
      - name: Inspect bounded official GovInfo December 2023 LSA PDF
        run: |
          python - <<'PY'
          import hashlib,io,json,re
          from urllib.request import Request,urlopen
          from pypdf import PdfReader

          url='https://www.govinfo.gov/content/pkg/LSA-2023-12/pdf/LSA-2023-12.pdf'
          with urlopen(Request(url,headers={'User-Agent':'HarborLens-open-research/0.1'}),timeout=60) as response:
              raw=response.read(9*1048576+1)
          assert 0<len(raw)<=9*1048576 and raw.startswith(b'%PDF-'), 'Missing or oversized official PDF'
          document=PdfReader(io.BytesIO(raw),strict=True)
          assert 10<len(document.pages)<300
          pages=[]
          for idx,page in enumerate(document.pages):
              extracted=page.extract_text() or ''
              pages.append(extracted)
          alltext='\n'.join(pages)
          starts=[(idx, re.search(r'TITLE\s*33\s*[-—_]?\s*NAVIGATION',txt,re.I))
                  for idx,txt in enumerate(pages)]
          found=[i for i,match in starts if match is not None]
          assert found,'TITLE 33 start not found in official LSA PDF'
          title_start=found[0]
          end_candidates=[i for i in range(title_start,len(pages))
                if re.search(r'TITLE\s*34\s*[-—_]?\s*EDUCATION',pages[i],re.I)]
          assert end_candidates,'TITLE 34 boundary not found'
          title_end=end_candidates[0]
          title_text='\n'.join(pages[title_start:title_end])
          assert title_start<title_end and len(title_text)>300
          direct=re.findall(r'(?<!\d)110\s*\.\s*197(?!\d)',title_text)
          nearby=[line.strip()[:220] for line in title_text.splitlines()
                  if re.match(r'^\s*110(?:\.\d+)?(?:\s|\.{2,})',line)][:20]
          result={
              'official_source':url,
              'official_pdf_sha256':hashlib.sha256(raw).hexdigest(),
              'pdf_pages':len(pages),
              'title33_page_range_zero_based':[title_start,title_end-1],
              'title33_extracted_text_sha256':hashlib.sha256(title_text.encode()).hexdigest(),
              'target_110_197_direct_text_occurrences':len(direct),
              'title33_110_entry_samples':nearby,
              'lsa_scope':'July 3 to December 29, 2023 (annual July CFR refresh)',
              'full_legal_effect_review_complete':False,
              'legal_status_for_2024_01_02':'NOT_DETERMINED',
              'authorized_ais_joins':0
          }
          print(json.dumps(result,indent=2))
          PY
