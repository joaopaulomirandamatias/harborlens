name: NOAA Anchorage Polygon GIS Integration (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  houston-anchorages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install GIS validation
        run: python -m pip install -e '.[geo,dev,noaa]'
      - name: Fetch bounded NOAA designated anchorage polygons
        run: |
          harborlens-fetch-noaa-anchorages \
            --bbox -95.70 29.10 -94.20 30.10 \
            --max-features 500 \
            --out data/houston-noaa-anchorage-areas.geojson
      - name: Validate contracts, report aggregate-only results
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from collections import Counter
          from jsonschema import Draft202012Validator,FormatChecker

          file=Path('data/houston-noaa-anchorage-areas.geojson')
          layer=json.loads(file.read_text())
          provenance=json.loads(file.with_name(file.name+'.source.json').read_text())
          gs=json.loads(Path('schemas/v1/noaa-anchorage-collection.schema.json').read_text())
          ps=json.loads(Path('schemas/v1/noaa-anchorage-source.schema.json').read_text())
          Draft202012Validator(gs,format_checker=FormatChecker()).validate(layer)
          Draft202012Validator(ps,format_checker=FormatChecker()).validate(provenance)
          assert hashlib.sha256(file.read_bytes()).hexdigest()==provenance['output_sha256']
          counter=Counter(x['geometry']['type'] for x in layer['features'])
          summary={
              'features':len(layer['features']),
              'polygon_shapes':dict(counter),
              'source_request_count':len(provenance['query_urls']),
              'source_layer':'NOAA OceanReports Designated Anchorage Areas',
              'output_sha256':provenance['output_sha256'],
              'source_rights_status':provenance['rights_status'],
              'historical_validity':provenance['historical_validity'],
              'geometry_review_status':provenance['geometry_review_status'],
              'port_event_inference':'NOT VERIFIED'
          }
          print(json.dumps(summary,indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write('### NOAA Houston designated Anchorage Area polygons\n\n')
              output.write('Current reference geometry only; not dated 2024 truth or safe navigation. '
                           'No source polygons, AIS or private data are committed or uploaded.\n\n')
              for k,v in summary.items():
                  output.write(f'- **{k}**: {v}\n')
          PY
      - name: Obtain one original historical NOAA daily AIS archive
        run: |
          harborlens-download-noaa --date 2024-01-02 --directory data --max-mib 300
      - name: Extract historical Houston AIS and infer only provisional candidates
        run: |
          harborlens-extract-noaa-archive \
            --input data/ais-2024-01-02.csv.zst \
            --out data/houston-2024-01-02.csv \
            --start 2024-01-02T00:00:00Z \
            --end 2024-01-02T06:00:00Z \
            --bbox -95.70 29.10 -94.20 30.10 \
            --max-rows 250000 --max-output-mib 64
          harborlens \
            --input data/houston-2024-01-02.csv \
            --out results/houston-2024-01-02 \
            --source-url https://noaaocm.blob.core.windows.net/ais/csv2/csv2024/ais-2024-01-02.csv.zst
          harborlens-verify --manifest results/houston-2024-01-02/manifest.json
      - name: Annotate strictly unverified candidate-centroid polygon overlap
        run: |
          harborlens-zone-context \
            --candidates results/houston-2024-01-02/stationary_candidates.geojson \
            --polygons data/houston-noaa-anchorage-areas.geojson \
            --out results/houston-2024-01-02/noaa-anchorage-context.geojson
      - name: Report only aggregate overlap diagnostics (no individual AIS or polygons)
        run: |
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          meta=json.loads(Path('results/houston-2024-01-02/noaa-anchorage-context.geojson.source.json').read_text())
          run=json.loads(Path('results/houston-2024-01-02/manifest.json').read_text())
          data=Path('results/houston-2024-01-02/noaa-anchorage-context.geojson')
          assert hashlib.sha256(data.read_bytes()).hexdigest()==meta['output_sha256']
          assert meta['counts']['total_candidates']==run['events']['stationary_candidates']
          assert meta['counts']['one_overlap']+meta['counts']['multiple_overlaps']+meta['counts']['no_overlap']==meta['counts']['total_candidates']
          summary={'historical_ais_window':'2024-01-02T00:00:00Z/2024-01-02T06:00:00Z',
                   'candidate_count_unvalidated':meta['counts']['total_candidates'],
                   'possible_spatial_overlaps_unverified':meta['counts']['one_overlap'],
                   'ambiguous_overlaps':meta['counts']['multiple_overlaps'],
                   'no_overlap_observed':meta['counts']['no_overlap'],
                   'historical_polygon_validity':meta['historical_validity'],
                   'source_rights_status':meta['rights_status'],
                   'source_output_integrity':'PASS',
                   'operational_event_classification':'NOT VERIFIED'}
          print(json.dumps(summary,indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('\n### Candidate centroids vs current NOAA polygons — NOT historical truth\n\n')
              for k,v in summary.items():
                  out.write(f'- **{k}**: {v}\n')
          PY
