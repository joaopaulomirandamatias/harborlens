name: Official Federal Register 2023 full-text triage (research)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-four-original-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install source audit and contract dependencies
        run: python -m pip install -e '.[dev]'
      - name: Fetch and checksum four original Federal Register documents
        run: |
          harborlens-fr-fulltext --out results/official-fr-2023-fulltext.json
      - name: Validate source contract and print metadata only
        run: |
          python - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          path=Path('results/official-fr-2023-fulltext.json')
          report=json.loads(path.read_text(encoding='utf-8'))
          schema=json.loads(Path('schemas/v1/fr-official-text-triage.schema.json').read_text())
          Draft202012Validator(schema,format_checker=FormatChecker()).validate(report)
          assert report['document_count']==4
          assert report['section_110_197_historical_effect']=='NOT_DETERMINED'
          assert report['lsa_full_review_complete'] is False
          assert report['ais_geofence_approval'] is False
          summary={
            'documents_retrieved':report['document_count'],
            'report_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
            'original_documents':[
              {'id':d['document_number'],'date':d['publication_date'],
               'title':d['title'],'indexed_type':d['indexed_document_type'],
               'mentions_110_197':d['text_mentions_110_197'],
               'location_signals':d['location_text_signals'],
               'withdrawal_text_signal':d['text_mentions_withdrawal'],
               'metadata_sha256':d['metadata_sha256'],
               'raw_text_sha256':d['raw_text_sha256']}
              for d in report['documents']
            ],
            'full_official_text_retrieval':'PASS',
            'schema_validation':'PASS',
            'lsa_review_complete':False,
            'exact_110_197_effective_state':'NOT_DETERMINED',
            'authorized_ais_geospatial_joins':0
          }
          print(json.dumps(summary,indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
            out.write('### Federal Register official 2023 Part 110 original texts\n\n')
            out.write('Only document metadata and cryptographic hashes are printed. No historic legal or nautical conclusion.\n\n')
            for k,v in summary.items():
              out.write(f'- **{k}**: {v}\n')
          PY
