name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[noaa]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: harborlens --input tests/fixtures/synthetic_ais.csv --out results
