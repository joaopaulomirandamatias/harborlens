name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (pyproject requires-python) and current.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[noaa,dev,geo]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: harborlens --input tests/fixtures/synthetic_ais.csv --out results
