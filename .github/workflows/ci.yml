name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (pyproject requires-python) and current.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[noaa,dev,geo,rights,lsa]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: harborlens --input tests/fixtures/synthetic_ais.csv --out results
      - name: Wheel install outside the checkout
        run: bash tools/check_rights_wheel_install.sh
      - name: Release schemas in the wheel and sdist
        run: bash tools/check_release_schema_wheel_install.sh
