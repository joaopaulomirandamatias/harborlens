name: NOAA full-day multi-day integration (research only)
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First UTC day (YYYY-MM-DD; years in harborlens.vintages)"
        required: true
        default: "2024-01-02"
      days:
        description: "Consecutive full UTC days to process (2-7)"
        required: true
        default: "7"

permissions:
  contents: read

jobs:
  full-days-houston:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install optional NOAA support
        run: python -m pip install -e '.[noaa]'
      - name: Validate inputs
        env:
          START_DATE: ${{ inputs.start_date }}
          DAYS: ${{ inputs.days }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta
          from harborlens.vintages import vintage_for
          start = date.fromisoformat(os.environ["START_DATE"])
          days = int(os.environ["DAYS"])
          assert 2 <= days <= 7, "days must be 2..7"
          for offset in range(days):
              vintage_for(start + timedelta(days=offset))  # refuses unregistered years
          PY
      - name: Show archive layouts
        env:
          START_DATE: ${{ inputs.start_date }}
          DAYS: ${{ inputs.days }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta
          from harborlens.vintages import vintage_for
          start = date.fromisoformat(os.environ["START_DATE"])
          for offset in range(int(os.environ["DAYS"])):
              day = start + timedelta(days=offset)
              v = vintage_for(day)
              print(day, v.layout, v.url(day), "-", v.verification)
          PY
      - name: Download and extract full UTC days, one archive at a time
        env:
          START_DATE: ${{ inputs.start_date }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          mkdir -p data
          for offset in $(seq 0 $((DAYS - 1))); do
            day=$(date -u -d "${START_DATE} + ${offset} day" +%F)
            archive=$(python -c "from datetime import date; from harborlens.vintages import vintage_for; d=date.fromisoformat('${day}'); print(vintage_for(d).filename(d))")
            harborlens-download-noaa --date "$day" --directory data --max-mib 512
            harborlens-extract-noaa-archive \
              --input "data/${archive}" \
              --out "data/houston-${day}.csv" \
              --start "${day}T00:00:00Z" --end "${day}T23:59:59Z" \
              --bbox -95.7 29.1 -94.2 30.1 \
              --max-rows 1000000 --max-output-mib 256
            rm "data/${archive}"
          done
      - name: Reconstruct candidates and measure resources
        run: |
          python - <<'PY'
          import json, resource, time
          from pathlib import Path
          from harborlens.multiday import MAX_POINTS, MAX_SCRATCH_MIB, run_multiday
          inputs = sorted(Path('data').glob('houston-*.csv'))
          started = time.perf_counter()
          result = run_multiday(inputs, Path('results/noaa-week'), max_points=MAX_POINTS,
                                max_scratch_mib=MAX_SCRATCH_MIB)
          sidecars = [json.loads(Path(f"{p}.source.json").read_text()) for p in inputs]
          summary = {
              'days': len(inputs),
              'input_sha256': [x['sha256'] for x in result['input_files']],
              'rows_selected_per_day': [s['counts']['selected'] for s in sidecars],
              'total_records': result['counts']['total'],
              'accepted_records': result['counts']['written'],
              'distinct_mmsi': result['events']['vessels'],
              'stationary_candidates_unvalidated': result['events']['stationary_candidates'],
              'cross_midnight_candidates_unvalidated': result['events']['cross_day_candidates'],
              'window_censoring_counts_br019': result['events']['censoring'],
              'analysis_window_blocks': result['analysis_window']['blocks'],
              'discarded_by_reason': result['events']['discarded_by_reason'],
              'gap_splits': result['events']['gap_splits'],
              'candidates_per_mmsi': result['events']['candidates_per_mmsi'],
              'limits': result['limits'],
              'scratch_peak_mib': round(result['resources']['scratch_peak_bytes'] / 1048576, 1),
              'elapsed_seconds': round(time.perf_counter() - started, 1),
              'peak_rss_kib': resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,
              'run_id': result['run_id'],
              'parameter_set': result['method_parameters']['parameter_set'],
              'source_rights_status': result['source_rights_status'],
          }
          print(json.dumps(summary, indent=2))
          Path('summary.json').write_text(json.dumps(summary, indent=2))
          PY
          harborlens-verify --manifest results/noaa-week/manifest.json
      - name: Publish aggregate engineering metrics only
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path('summary.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('### Consecutive full NOAA days — Houston research sample\n\n')
              out.write('No raw AIS is committed, uploaded, or used for navigation. '
                        'Candidates are unvalidated and data rights need review.\n\n')
              for key, value in summary.items():
                  out.write(f'- **{key}**: {value}\n')
          PY
