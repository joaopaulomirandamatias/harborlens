name: Bug report
description: Report a reproducible defect in existing behavior
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected versus actual behavior, test fixture
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Existing spec and requirement IDs
  - type: textarea
    id: env
    attributes:
      label: Environment, anonymized logs and potential security impact
